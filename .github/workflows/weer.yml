name: Weer bijwerken

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub kan een paar minuten later starten dan gepland
  workflow_dispatch:         # handmatig starten via Actions-tab
  push:
    branches: [main]
    paths: ["site/**", "fetch_weather.py", "fetch_radar.py", ".github/workflows/weer.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: weer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests h5py numpy pyproj

      - name: Waarnemingen ophalen bij KNMI
        env:
          KNMI_API_KEY: ${{ secrets.KNMI_API_KEY }}
          PREVIOUS_URL: https://dkl-strategy.github.io/zoeck-weer/data.json
        run: python fetch_weather.py

      - name: Buienradar-nowcast ophalen bij KNMI
        env:
          KNMI_API_KEY: ${{ secrets.KNMI_API_KEY }}
          KNMI_OPEN_DATA_KEY: ${{ secrets.KNMI_OPEN_DATA_KEY }}
        run: python fetch_radar.py

      - name: Site klaarzetten voor GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Publiceren op GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
