name: Weer bijwerken

on:
  schedule:
    - cron: "*/10 * * * *"   # reserve; cron-job.org triggert via workflow_dispatch
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "fetch_weather.py", "fetch_radar.py", ".github/workflows/weer.yml"]

permissions:
  contents: write            # nodig om de data-branch te schrijven
  pages: write
  id-token: write

concurrency:
  group: weer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests h5py numpy pyproj

      - name: Waarnemingen ophalen bij KNMI
        env:
          KNMI_API_KEY: ${{ secrets.KNMI_API_KEY }}
          PREVIOUS_URL: https://raw.githubusercontent.com/${{ github.repository }}/data/data.json
        run: python fetch_weather.py

      - name: Buienradar-nowcast ophalen bij KNMI
        env:
          KNMI_API_KEY: ${{ secrets.KNMI_API_KEY }}
          KNMI_OPEN_DATA_KEY: ${{ secrets.KNMI_OPEN_DATA_KEY }}
        run: python fetch_radar.py

      # Data naar de branch "data": één commit die telkens wordt overschreven (geen groeiende geschiedenis).
      # De pagina leest data.json/radar.json/radar-grid.json via raw.githubusercontent.com.
      - name: Data publiceren naar branch "data"
        run: |
          mkdir -p /tmp/data && cp site/data.json site/radar.json site/radar-grid.json /tmp/data/ 2>/dev/null || true
          cd /tmp/data
          git init -q -b data
          git config user.name "weer-bot"
          git config user.email "weer-bot@users.noreply.github.com"
          git add .
          git commit -q -m "data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

  # De statische pagina zelf: alleen opnieuw publiceren als hij wijzigt (push), niet elke 5 minuten
  pages:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: update
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Site klaarzetten voor GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Publiceren op GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
