name: Weer bijwerken

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub kan een paar minuten later starten dan gepland
  workflow_dispatch:         # handmatig starten via Actions-tab
  push:
    branches: [main]
    paths: ["site/**", "fetch_weather.py", ".github/workflows/weer.yml"]

concurrency:
  group: weer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Waarnemingen ophalen bij KNMI
        env:
          KNMI_API_KEY: ${{ secrets.KNMI_API_KEY }}
        run: python fetch_weather.py

      - name: Uploaden naar zoeck.com/weer (SFTP)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.FTP_SERVER }}       # zoeck.com.transurl.nl
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: ./site/*
          remote_path: /www/weer                  # map waarin index.html staat
          sftp_only: true
```

dit is de code van weer.yml
