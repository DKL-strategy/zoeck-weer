name: Weer bijwerken

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub kan een paar minuten later starten dan gepland
  workflow_dispatch:         # handmatig starten via Actions-tab
  push:
    branches: [main]
    paths: ["site/**", "fetch_weather.py", ".github/workflows/weer.yml"]

concurrency:
  group: weer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Waarnemingen ophalen bij KNMI
        env:
          KNMI_API_KEY: ${{ secrets.KNMI_API_KEY }}
        run: python fetch_weather.py

      - name: Verbinding met SFTP-server testen
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          echo "Host: $SERVER"
          nc -zv -w 10 "$SERVER" 22

      - name: Uploaden naar zoeck.com/weer (SFTP)
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          USER: ${{ secrets.FTP_USERNAME }}
          PASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: /www/weer            # map waarin index.html staat
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          lftp -u "$USER,$PASS" "sftp://$SERVER" -e "
            set sftp:auto-confirm yes;
            set net:timeout 20;
            set net:max-retries 2;
            set net:reconnect-interval-base 5;
            mirror -R --verbose site $REMOTE_DIR;
            bye"
